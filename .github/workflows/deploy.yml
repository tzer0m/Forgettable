name: Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, tzer0m]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stop service
        run: sudo systemctl stop Forgettable.service
      - name: Publish
        run: dotnet publish Forgettable/Forgettable.csproj -c Release -o /home/tzer0m/Services/Forgettable
      - name: Start service
        run: sudo systemctl start Forgettable.service
      - name: Check status
        run: sudo systemctl status Forgettable.service --no-pager
